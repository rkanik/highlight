# PUBG Shorts / Reels edit preferences
# Apply these rules to every future highlight cut unless the user overrides them.
#
# Rules (Cursor):
#   .cursor/rules/pubg-shorts-global.mdc  — always-on global config
#   .cursor/rules/pubg-shorts-ks1.mdc     — template KS1 (kill shots)
#   .cursor/rules/pubg-shorts-ks1a.mdc    — template KS1A (kills + assists)
#   .cursor/rules/pubg-shorts-mh1.mdc     — template MH1 (landscape match highlight)
#
# Templates override include/exclude/priority for a given run.
# Active template for a job is set via `active_template` or the user's request.

source_dir: "V:/PUBG"
active_template: MH1  # current run; set null or another template name as needed

templates:
  KS1:
    name: Kill Shots
    description: Only moments where I knocked or killed an enemy
    include:
      - my_knocks
      - my_kills
      - knock_to_finish_sequences
    exclude:
      - chicken_dinner_or_winner_screen
      - spectator_or_deathcam
      - other_players_feed_kills
      - utility_outside_kill_padding
      - final_circle_without_knock_or_kill
      - long_looting
      - quiet_rotations_with_no_action
      - AFK_or_menu_time
      - duplicate_overlapping_clips
      - replay_control_panel_open_frames
    priority_order:
      1: my_kills_and_multi_kills
      2: my_knocks
      3: knock_to_finish_sequences
    title_moment_types:
      - kill montage
      - multi kill
      - knock chain
    omit_hashtags:
      - "#ChickenDinner"
  KS1A:
    name: Kill Shots + Assists
    description: KS1 plus my assist kills (damage helping teammate finishes)
    include:
      - my_knocks
      - my_kills
      - my_assists
      - knock_to_finish_sequences
    exclude:
      - chicken_dinner_or_winner_screen
      - spectator_or_deathcam
      - other_players_feed_kills
      - utility_outside_kill_padding
      - final_circle_without_knock_or_kill
      - long_looting
      - quiet_rotations_with_no_action
      - AFK_or_menu_time
      - duplicate_overlapping_clips
      - replay_control_panel_open_frames
    priority_order:
      1: my_kills_and_multi_kills
      2: my_knocks
      3: my_assists
      4: knock_to_finish_sequences
    title_moment_types:
      - kill montage
      - assist montage
      - team fight
    omit_hashtags:
      - "#ChickenDinner"
    extra_hashtags:
      - "#Assist"
      - "#TeamPlay"
  MH1:
    name: Match Highlight (Landscape)
    description: Landscape match highlight — fights, kills, assists, engagements, utility, special moments
    aspect_ratio: "16:9"
    resolution: "1920x1080"
    max_seconds: 600
    include:
      - my_knocks
      - my_kills
      - my_assists
      - knock_to_finish_sequences
      - gunfight_engagements
      - grenade_throws
      - molotov_throws
      - stun_flash_throws
      - smoke_utility_when_in_fight
      - airdrop_or_special_tip_if_present
      - chicken_dinner_or_winner_screen_if_present
      - landing_when_present
      - cold_open_top_kills
    cold_open:
      enabled: true
      target_seconds: 5
      min_kills: 3
      max_kills: 5
    landing:
      enabled: true
      pad_before_seconds: 1
      pad_after_seconds: 4
      as_match_separator: true
    exclude:
      - spectator_or_deathcam
      - other_players_unrelated_feed
      - long_looting
      - quiet_rotations_with_no_action
      - AFK_or_menu_time
      - duplicate_overlapping_clips
      - replay_control_panel_open_frames
      - pad_quiet_time_to_fill_10_min
    priority_order:
      1: my_kills_and_multi_kills
      2: my_knocks
      3: my_assists
      4: utility_into_fight
      5: gunfight_engagements
      6: special_moments_winner_airdrop
    title_moment_types:
      - match highlight
      - fight reel
      - squad highlight
    title_style:
      never_use_count: true
      always_ai_hook: true
      format: "hook | PUBG"
    omit_hashtags:
      - "#ChickenDinner"  # only when winner confirmed at assemble time
    extra_hashtags:
      - "#MatchHighlight"
      - "#PUBGHighlights"
    thumbnail:
      size: "1920x1080"
      primary_aspect: "16:9"
      ai_generate: true
      ai_refs: ["augniik-character.png", "augniik-cover.jpg"]
      logo_path: "augniik-profile.jpg"
      logo_count: 1
      no_lobby_circle_over_ai_hero: true
      composite_script: "scripts/composite_ai_thumb.py"
      also_shorts_portrait: false
    padding:
      before_kill_seconds: 5
      after_kill_seconds: 4
      before_utility_seconds: 2
      after_utility_seconds: 3
      before_engagement_seconds: 4
      after_engagement_seconds: 4
    clip_merging:
      merge_gap_seconds: 5
      min_clip_seconds: 6
      max_single_clip_seconds: 45

format:
  aspect_ratio: "9:16"
  resolution: "1080x1920"
  fps: 60
  container: mp4
  # ALWAYS prefer GPU — CPU analysis previously overheated this PC
  decode: cuda
  video_encoder: h264_nvenc
  video_preset: p5
  cq: 18
  video_bitrate_mbps: 12
  maxrate_mbps: 16
  audio_bitrate_kbps: 192
  ffmpeg_threads: 1
  filter_threads: 1
  crop:
    # 1920x1080 center crop to portrait; trim replay UI + top stats
    portrait_width: 608
    portrait_height: 1000
    x_offset: 656
    y_offset: 40
  scale_to: "1080x1920"

length:
  target_min_seconds: 45
  target_max_seconds: 90
  allow_over_60_to_keep_all_kills: true

include:
  - all_kills
  - knock_to_finish_sequences
  - grenade_throws
  - molotov_throws
  - stun_flash_throws
  - smoke_utility_when_in_fight_or_final_circle
  - blue_zone_pressure_moments
  - final_circle_climax
  - chicken_dinner_or_winner_screen_if_present

exclude:
  - long_looting
  - quiet_rotations_with_no_action
  - AFK_or_menu_time
  - duplicate_overlapping_clips
  # CRITICAL: when the full PUBG replay control panel is open (EDIT / REPORT /
  # Play-Pause / speed), SKIP those frames entirely. Do NOT crop the bar —
  # remove the time ranges from the edit.
  - replay_control_panel_open_frames

replay_controls:
  skip_when_open: true
  crop_bar_instead_of_skip: false  # never; always skip frames
  detect: full_panel_only  # EDIT/REPORT/play UI — not the thin yellow timeline alone
  detection_region:
    # 1920x1080 source
    x: 500
    y: 1005
    w: 1200
    h: 70
  light_gray_ratio_threshold: 0.34
  sample_fps: 2
  pad_seconds: 0.3
  merge_gap_seconds: 1.0

padding:
  before_kill_seconds: 4
  after_kill_seconds: 3
  before_utility_seconds: 2
  after_utility_seconds: 3
  before_zone_pressure_seconds: 2
  after_zone_pressure_seconds: 2
  final_circle_lead_in_seconds: 5
  winner_screen_hold_seconds: 4

clip_merging:
  merge_gap_seconds: 3
  min_clip_seconds: 5
  max_single_clip_seconds: 30

priority_order:
  1: chicken_dinner_winner_screen
  2: kills_and_multi_kills
  3: utility_kills_or_utility_into_fight
  4: final_circle_blue_zone
  5: strong_gunfights_without_confirmed_kill

detection:
  # Keep detection LIGHT — no dense CPU frame OCR on this machine
  use_audio_peaks: true
  use_kill_feed_change_detection: true
  reuse_cached_detection_json: true
  sample_kill_feed_fps: 1
  audio_peak_threshold_dbfs: -26
  # Never run heavy PIL frame scans / full-video CPU decode again without GPU path
  forbid_heavy_cpu_analysis: true

style:
  pacing: keep_action_readable_not_hypercut
  transitions: hard_cuts_only
  text_overlays: false
  music: false
  keep_game_audio: true

output_metadata:
  # ALWAYS generate a title and use it as the output filename + description file
  always_generate_title: true
  use_title_as_filename: true
  write_description_txt: true
  always_generate_thumbnail: true
  # Keep ALL deliverables in one folder named after the title
  package_in_title_folder: true
  output_dir: out
  title_folder_pattern: "out/{title}/"
  description_filename_pattern: "{title}.txt"
  video_filename_pattern: "{title}.mp4"
  thumbnail_filename_pattern: "{title}.jpg"
  meta_filename_pattern: "{title}.meta.json"
  filename_sanitize:
    replace_invalid_chars_with: " "
    collapse_whitespace: true
    max_length: 120
  title_style:
    format: "hook | PUBG"   # short, punchy, Shorts/Reels friendly
    include_game: true
    include_moment_type: true  # clutch / final circle / multi kill / chicken dinner
    avoid_clickbait_lies: true  # don't claim CD if winner screen missing
  thumbnail:
    size: "1080x1920"          # match Shorts aspect
    also_youtube_1280x720: true
    pick_peak_action_frame: true
    style: eye_catchy_branded
    # AI hero uses character ref; composite ONE logo only — scripts/make_augniik_thumb.py
    avatar_path: "augniik-character.png"   # GenerateImage reference (not a second circle badge)
    logo_path: "augniik-profile.jpg"       # exactly one logo (already has AUGNIIK text)
    logo_count: 1
    no_lobby_circle_over_ai_hero: true     # avoids double avatar
    no_second_brand_chip: true
    no_extra_wordmark: true
    shorts_aspect: "9:16"
    yt_aspect: "16:9"
    resize_mode: cover_crop                # never stretch landscape AI into 9:16
    brand_colors: ["#00D2FF", "#FF8C14", "#FFE600"]  # cyan / orange / yellow
    effects:
      - contrast_boost
      - saturation_boost
      - vignette
      - diagonal_neon_slash
      - brand_side_rails
      - bold_title_text
      - thick_stroke_outline
      - avatar_white_ring
    text:
      primary_from_title_hook: true
      secondary: "PUBG SHORTS"
      brand_name: "AUGNIIK"
      colors: ["#FFEE00", "#FFFFFF", "#00D2FF"]
      outline: "#000000"
  description:
    platforms: [youtube_shorts, facebook_reels]
    include:
      - title_line
      - 1_to_3_sentence_summary
      - moment_bullets
      - keyword_block
      - hashtag_block
    hashtag_count_min: 8
    hashtag_count_max: 18
    always_include_tags:
      - "#PUBG"
      - "#PUBGMobile"   # optional reach; keep even for PC if shorts audience overlaps
      - "#PUBGHighlights"
      - "#Gaming"
      - "#FPS"
      - "#Shorts"
      - "#Reels"
      - "#ChickenDinner"  # only if winner confirmed; else omit
    keyword_examples:
      - PUBG highlights
      - final circle
      - clutch
      - smoke play
      - blue zone
      - squad wipe
      - battlegrounds

safety:
  # HARD — PC restarted at 99% CPU / ~85–90C. Never relax without user override.
  require_gpu_decode: true
  require_gpu_encode: true
  prefer_gpu_encode: true
  prefer_gpu_decode: true
  max_cpu_threads: 1
  ffmpeg_threads: 1
  filter_threads: 1
  one_ffmpeg_at_a_time: true
  forbid_batch_windows_ocr: true
  max_ocr_frames_per_video: 40
  forbid_heavy_cpu_analysis: true
  forbid_parallel_detect_and_encode: true
  note: "99% CPU / 85C+ caused auto restart. CUDA decode + NVENC encode only for heavy work. OCR only sparse prefiltered candidates."

notes:
  - Always keep ALL kills even if the short goes over 60 seconds.
  - Keep extra seconds before and after each kill.
  - Keep utility throws (grenade, molotov, stun/flash) and blue-zone pressure.
  - If recording ends before winner screen, keep final clash; note missing CD.
  - Next recording tip: continue 5-10s after last kill for Chicken Dinner screen.
  - Always skip frames where the full replay control panel is open — do not crop the bar.
  - Thin yellow replay timeline alone is OK; full EDIT/REPORT panel must be removed.
  - Always generate a title; save video as "{title}.mp4" and description as "{title}.txt" with keywords + hashtags.
  - Always generate an eye-catchy thumbnail ({title}.jpg) and package all files in out/{title}/.
